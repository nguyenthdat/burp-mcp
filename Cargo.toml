[workspace]
resolver = "2"
members = [
    "crates/burp-protocol",
    "crates/burp-mcp",
    "crates/burp-tools",
    "crates/sitegraph",
    "crates/utility-engine",
    "crates/sitegraph-daemon",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
version = "3.2.0"

[workspace.metadata]
authors = ["Dat Nguyen <dat.nguyen@bitbytelab.io>"]

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
ciborium = "0.2.2"
blake3 = "1.8.3"
capnp = "0.27.0"
capnp-rpc = "0.27.0"
capnpc = "0.27.0"
futures = "0.3.31"
brotli = "8.0.2"
html-escape = "0.2.13"
flate2 = "1.1.5"
fs2 = "0.4.3"
hex = "0.4.3"
num-bigint = "0.4.6"
hmac = "0.12.1"
md-5 = "0.10.6"
http = "1.3.1"
petgraph = "0.8.3"
proptest = "1.9.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
tempfile = "3.23.0"
time = { version = "0.3.44", features = ["serde"] }
url = "2.5.7"
percent-encoding = "2.3.2"
sha1 = "0.10.6"
sha2 = "0.10.9"
sha3 = "0.10.8"
clap = { version = "4.6.6", features = ["derive", "env"] }
prost = "0.14.4"
thiserror = "2.0.17"
regex = "1.12.2"
toml = "1.1.4"
serde = { version = "1.0.228", features = ["derive"] }
unescaper = "0.2.0"
tokio-util = { version = "0.7.17", features = ["compat"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time", "io-std"] }
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
tonic-prost = "0.14.6"
rmcp = { version = "3.1.4", features = ["macros", "server", "transport-io"] }
prost-build = "0.14.4"
getrandom = "0.3.4"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
schemars = "1.1.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
pest = "2.7"
pest_derive = "2.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
