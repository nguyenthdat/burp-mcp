[workspace]
resolver = "2"
members = ["crates/burp-grpc", "crates/burp-mcp"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
version = "3.0.0-alpha.1"
authors = ["Dat Nguyen"]

[workspace.dependencies]
anyhow = "1.0.100"
prost = "0.14.4"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
