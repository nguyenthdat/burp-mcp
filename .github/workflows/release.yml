name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: release-nguyenthdat-burpmcp
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable release bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed release source and version
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          test "${RELEASE_IS_PRERELEASE}" = "false"
          case "${VERSION}" in
            *-*) echo "Prerelease versions are not supported by this stable release workflow" >&2; exit 1 ;;
          esac
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
      - name: Install Cap'n Proto compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y capnproto
      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.7.0"
          cache-disabled: true
      - name: Build native MCP binary, sitegraph daemon, and extension JAR
        run: |
          cargo build --release --locked -p burp-mcp -p sitegraph-daemon
          gradle --no-daemon clean test jar -Pversion="${GITHUB_REF_NAME#v}"
      - name: Stage release bundle
        run: |
          cargo cyclonedx --manifest-path crates/burp-mcp/Cargo.toml --format json --describe binaries
          mkdir -p release
          # Native platform binaries are supplied by the native-assets matrix.
          cp build/libs/burp-mcp.jar release/burp-mcp.jar
          cp crates/burp-mcp/burp-mcp_bin.cdx.json release/burp-mcp.cdx.json
          cp crates/sitegraph/src/enrichment/rules/default-rules.json release/default-rules.json
          (cd release && sha256sum * > SHA256SUMS)
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  native-assets:
    name: Build native ${{ matrix.asset }} and ${{ matrix.daemon_asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: burp-mcp-linux-x86_64
            daemon_asset: sitegraph-daemon-linux-x86_64
          - os: macos-15
            asset: burp-mcp-macos-aarch64
            daemon_asset: sitegraph-daemon-macos-aarch64
          - os: macos-15-intel
            asset: burp-mcp-macos-x86_64
            daemon_asset: sitegraph-daemon-macos-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
      - name: Install Cap'n Proto compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y capnproto
      - name: Install Cap'n Proto compiler
        if: runner.os == 'macOS'
        run: brew install capnp
      - name: Install Cap'n Proto compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install capnproto --no-progress -y
      - name: Build native MCP and sitegraph daemon binaries
        run: cargo build --release --locked -p burp-mcp -p sitegraph-daemon
      - name: Stage native binaries
        shell: bash
        run: |
          mkdir -p native-asset
          cp target/release/burp-mcp "native-asset/${{ matrix.asset }}"
          cp target/release/sitegraph-daemon "native-asset/${{ matrix.daemon_asset }}"
      - name: Upload native binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.asset }}-${{ github.sha }}
          path: native-asset/
          if-no-files-found: error
          retention-days: 7

  release-assets:
    name: Upload GitHub Release assets
    needs: [build, native-assets]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundle-${{ github.sha }}
          path: release-artifacts
      - name: Download native release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-*-${{ github.sha }}
          path: release-artifacts
          merge-multiple: true
      - name: Regenerate complete release checksums
        run: |
          cd release-artifacts
          sha256sum burp-mcp* sitegraph-daemon* default-rules.json > SHA256SUMS
      - name: Verify release bundle checksums
        run: cd release-artifacts && sha256sum --check SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: release-artifacts/SHA256SUMS
      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-artifacts/* --clobber --repo "${GITHUB_REPOSITORY}"
