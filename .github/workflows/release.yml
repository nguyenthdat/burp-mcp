name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: release-nguyenthdat-burpmcp
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable release bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Verify reviewed release source and version
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          test "${RELEASE_IS_PRERELEASE}" = "false"
          case "${VERSION}" in
            *-*) echo "Prerelease versions are not supported by this stable release workflow" >&2; exit 1 ;;
          esac
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.7.0"
          cache-disabled: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run bridge checks
        run: bun run check
      - name: Test and build extension
        run: gradle clean test jar
      - name: Pack and verify release bundle
        id: bundle
        run: |
          mkdir -p release-artifacts
          npm pack --ignore-scripts --json --pack-destination release-artifacts > npm-pack.json
          TARBALL="$(node scripts/validate-pack-report.cjs npm-pack.json release-artifacts)"
          cp build/libs/burp-mcp.jar release-artifacts/burp-mcp.jar
          VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(unzip -p release-artifacts/burp-mcp.jar META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Implementation-Version: //p')"
          test "${MANIFEST_VERSION}" = "${VERSION}"
          (
            cd release-artifacts
            sha256sum burp-mcp.jar "${TARBALL}" > SHA256SUMS
          )
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  release-assets:
    name: Upload GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundle-${{ github.sha }}
          path: release-artifacts
      - name: Verify release bundle checksums
        run: cd release-artifacts && sha256sum --check SHA256SUMS
      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-artifacts/* --clobber --repo "${GITHUB_REPOSITORY}"

  stage-npm:
    name: Stage npm package for 2FA approval
    needs:
      - build
      - release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundle-${{ github.sha }}
          path: release-artifacts
      - name: Verify release bundle checksums
        run: cd release-artifacts && sha256sum --check SHA256SUMS
      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install staged-publishing-compatible npm CLI
        run: npm install --global --ignore-scripts npm@12.0.2
      - name: Record npm approval instructions
        run: |
          {
            echo "## npm staged publishing"
            echo
            echo "The next step stages the package. Inspect it on npm's Staged Packages page, then approve it with 2FA."
            echo
            echo "CLI alternative: \`npm stage list @nguyenthdat/burpmcp\`, then \`npm stage approve <stage-id>\`."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Stage npm package with provenance
        run: |
          shopt -s nullglob
          TARBALLS=(release-artifacts/*.tgz)
          test "${#TARBALLS[@]}" -eq 1
          npm stage publish "${TARBALLS[0]}" --access public --provenance --json
