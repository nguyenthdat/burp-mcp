name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: release-nguyenthdat-burpmcp
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable release bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed release source and version
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          test "${RELEASE_IS_PRERELEASE}" = "false"
          case "${VERSION}" in
            *-*) echo "Prerelease versions are not supported by this stable release workflow" >&2; exit 1 ;;
          esac
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.7.0"
          cache-disabled: true
      - name: Build native MCP binary and extension JAR
        run: |
          cargo build --release --locked -p burp-mcp
          gradle --no-daemon clean test jar -Pversion="${GITHUB_REF_NAME#v}"
      - name: Stage release bundle
        run: |
          cargo cyclonedx --manifest-path crates/burp-mcp/Cargo.toml --format json --describe binaries --override-filename burp-mcp.cdx
          mkdir -p release
          # Native platform binaries are supplied by the native-assets matrix.
          cp build/libs/burp-mcp.jar release/burp-mcp.jar
          cp crates/burp-mcp/burp-mcp.cdx.json release/burp-mcp.cdx.json
          (cd release && sha256sum * > SHA256SUMS)
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  native-assets:
    name: Build native ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: burp-mcp-linux-x86_64
          - os: macos-15
            asset: burp-mcp-macos-aarch64
          - os: macos-13
            asset: burp-mcp-macos-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
      - name: Build native MCP binary
        run: cargo build --release --locked -p burp-mcp
      - name: Stage native MCP binary
        shell: bash
        run: |
          mkdir -p native-asset
          cp target/release/burp-mcp "native-asset/${{ matrix.asset }}"
      - name: Upload native MCP binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}-${{ github.sha }}
          path: native-asset/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release-assets:
    name: Upload GitHub Release assets
    needs: [build, native-assets]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundle-${{ github.sha }}
          path: release-artifacts
      - name: Download native release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: burp-mcp-*-${{ github.sha }}
          path: release-artifacts
          merge-multiple: true
      - name: Regenerate complete release checksums
        run: |
          cd release-artifacts
          sha256sum burp-mcp* > SHA256SUMS
      - name: Verify release bundle checksums
        run: cd release-artifacts && sha256sum --check SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: release-artifacts/SHA256SUMS
      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-artifacts/* --clobber --repo "${GITHUB_REPOSITORY}"
