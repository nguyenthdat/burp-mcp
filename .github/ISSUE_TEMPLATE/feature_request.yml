name: Feature request
description: Propose a bounded user-visible capability or workflow improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete user problem before proposing an interface.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the observable behavior, limits, and failure modes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and authorization impact
      description: Identify target access, sensitive data, destructive behavior, or new trust boundaries.
    validations:
      required: true
