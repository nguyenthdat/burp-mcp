[project]
name = "mcp-builder-evaluation"
version = "0.1.0"
description = "Lightweight MCP tool-usability evaluation harness"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49,<1",
  "mcp>=1.10,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
