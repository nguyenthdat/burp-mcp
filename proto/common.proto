syntax = "proto3";

package burp.v1;

option java_multiple_files = true;
option java_package = "io.github.nguyenthdat.burpmcp.grpc.v1";
option java_outer_classname = "CommonProto";

message PageRequest {
  uint32 limit = 1;
  string cursor = 2;
}

message PageInfo {
  uint32 total = 1;
  bool truncated = 2;
  string next_cursor = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_RESOURCE_EXHAUSTED = 4;
  ERROR_CODE_INTERNAL = 5;
}

message RpcError {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  string details = 4;
}
