[[rules]]
id = "source_map"
pattern = '''(?:^|[\"'`])[^\"'`\s]{1,512}\.js\.map(?:[?#][^\"'`\s]*)?'''
capture_group = 0
severity = "medium"
surfaces = [
    "response_body",
    "response_message",
    "websocket_payload",
    "websocket_edited_payload",
