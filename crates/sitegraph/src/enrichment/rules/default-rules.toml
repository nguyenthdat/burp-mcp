[pack]
id = "burp-mcp-sitegraph"
version = "2026.09.05"
max_matches = 512

[[rules]]
id = "remember_me"
pattern = '(?:^|[?&])rememberMe=[^&\s]+'
capture_group = 0
severity = "high"
surfaces = [
    "request_message",
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "jwt"
pattern = 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
capture_group = 0
severity = "high"
surfaces = [
    "request_message",
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "basic_auth"
pattern = '(?i)\bBasic\s+[A-Za-z0-9+/=_:-]{8,256}'
capture_group = 0
severity = "high"
surfaces = [
    "request_message",
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "bearer_auth"
pattern = '(?i)\bBearer\s+[A-Za-z0-9._~+/=-]{8,512}'
capture_group = 0
severity = "high"
surfaces = [
    "request_message",
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "secret_assignment"
pattern = '''(?i)(?:api[_-]?key|secret|token|access[_-]?token|client[_-]?secret|authorization)\s*[:=]\s*[\"']?([^\"'&\s]{4,256})'''
capture_group = 1
severity = "high"
surfaces = [
    "request_message",
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "password_assignment"
pattern = '''(?i)(?:password|passwd|pwd)\s*[:=]\s*[\"']([^\"']{1,128})[\"']'''
capture_group = 1
severity = "high"
surfaces = [
    "request_message",
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "cloud_access_key"
pattern = '(?i)\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'
capture_group = 0
severity = "high"
surfaces = [
    "request_message",
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "aliyun_access_key"
pattern = '\bLTAI[a-zA-Z0-9]{12,32}\b'
capture_group = 0
severity = "high"
surfaces = [
    "request_message",
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "jdbc_connection"
pattern = '''(?i)jdbc:[a-z][a-z0-9+.-]*://[^\s\"']{4,512}'''
capture_group = 0
severity = "high"
surfaces = [
    "request_message",
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "private_key_block"
pattern = "-----BEGIN [A-Z0-9 ]+ PRIVATE KEY-----"
