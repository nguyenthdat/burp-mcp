severity = "high"
surfaces = [
    "request_message",
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "email_address"
pattern = '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}\b'
capture_group = 0
severity = "medium"
surfaces = [
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "internal_ipv4"
pattern = '\b(?:127\.0\.0\.1|10\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.(?:[0-9]{1,3}\.)[0-9]{1,3}|192\.168\.(?:[0-9]{1,3}\.)[0-9]{1,3})\b'
capture_group = 0
severity = "medium"
surfaces = [
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "unix_password_file"
pattern = "(?m)^[^:]{1,64}:[^:]*:[0-9]+:[0-9]+:[^:]*:/[^:]*:/(?:bin|usr/bin)/(?:ba|z|fi|sh)sh$"
capture_group = 0
severity = "critical"
surfaces = [
    "response_message",
    "response_body",
    "websocket_payload",
    "websocket_edited_payload",
]

[[rules]]
id = "windows_path"
