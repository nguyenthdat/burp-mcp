version: "1.0.0"
title: "Burp MCP Goose Workspace"
description: "Project-local Goose recipe providing macOS automation, Java documentation lookup, and the Burp MCP bridge."
instructions: |
  You are working in the burp-mcp repository and have access to its project MCP servers.

  Use the MCP tools deliberately:
  - macos: macOS automation and system interaction.
  - javadoc: Java/JVM API documentation lookup.
  - burpmcp: Burp Suite and CyberChef security-testing tools exposed by this repository's local bridge.

  Prefer the repository's existing code and configuration. For security-testing actions, only operate on targets explicitly authorized by the user. Explain what you are going to do before making potentially destructive or externally visible changes. When a task is complete, summarize the MCP tools used, changes made, and verification performed.
prompt: "Inspect the current repository and wait for my task."
extensions:
  - type: stdio
    name: macos
    cmd: env
    args:
      - ANONYMIZED_TELEMETRY=false
      - macos-mcp
      - serve
      - --transport
      - stdio
    timeout: 300
    description: "macOS automation MCP server"
